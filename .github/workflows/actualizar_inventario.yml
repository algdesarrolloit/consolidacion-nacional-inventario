name: Actualización Automática de Inventario

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-powershell:
    runs-on: windows-latest

    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v3

    - name: Ejecutar Extractor PowerShell
      shell: pwsh
      run: |
        .\extractor.ps1

    - name: Guardar Cambios en el Repositorio
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update inventario [skip ci]" && git push)
